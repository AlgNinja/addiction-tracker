# ==============================================================================
# RENDER BLUEPRINT (render.yaml)
# ==============================================================================
# Render uses this file to automatically configure both your PostgreSQL database
# and your Node/React web service in a single setup flow.
# ==============================================================================

services:
  # Full-Stack Web Service (Node.js + Express serving built React frontend)
  - type: web
    name: sobertrack-app
    runtime: node
    plan: free
    region: oregon # or ohio, frankfurt, singapore
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # Automatically links to the PostgreSQL database created below
      - key: DATABASE_URL
        fromDatabase:
          name: sobertrack-db
          property: connectionString
      # Sensitive Clerk Keys (Render will prompt you to enter these in the UI)
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false

databases:
  # Managed PostgreSQL Database on Render
  - name: sobertrack-db
    plan: free
    databaseName: addiction_tracker
    user: tracker_user
